<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 让 iOS Safari 暴露 env(safe-area-inset-*)，
         配合 Layout Header 的安全区 padding 才能避免 PWA 状态栏遮挡。
         注意：去掉了 maximum-scale=1.0 + user-scalable=no（反 a11y，
         Apple 在 iOS 10+ 已明确建议不要禁用用户缩放）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="提示词库" />

    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    
    <!-- Apple Touch Icon -->
